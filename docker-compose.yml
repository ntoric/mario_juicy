version: '3.8'

services:
  db:
    container_name: pos_db
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-posdb}
      - POSTGRES_USER=${POSTGRES_USER:-posuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pospassword}
    networks:
      - pos_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-posuser} -d ${POSTGRES_DB:-posdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: pos_redis
    image: redis:7-alpine
    restart: always
    networks:
      - pos_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: pos_backend
    image: ntoric/mario-backend:latest
    restart: always
    ports:
      - "8020:8000"
    env_file:
      - ./env/.env.backend
    environment:
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pos_network

  frontend:
    container_name: pos_frontend
    image: ntoric/mario-frontend:latest
    restart: always
    ports:
      - "3020:80"
    env_file:
      - ./env/.env.frontend
    depends_on:
      - backend
    networks:
      - pos_network

  adminer:
    container_name: pos_adminer
    image: adminer
    profiles:
      - tools
    ports:
      - "8021:8080"
    depends_on:
      - db
    networks:
      - pos_network

volumes:
  postgres_data:

networks:
  pos_network:
    driver: bridge
